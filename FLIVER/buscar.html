<!DOCTYPE html>
<html class="oscuro" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fliver - Búsqueda</title>
    <link rel="icon" type="image/png" href="Imagenes/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-izq">
            <a href="index.html" style="display:flex; align-items:center; text-decoration:none; color:white;">
                <img src="Imagenes/logo.png" class="logo" width="50" height="50">
                <span style="font-size: 24px; font-weight: bold; margin-left: 10px;">Fliver</span>
            </a>
        
            <div class="contenedor-busqueda">
                <button type="submit" class="btn-busqueda">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
                <input type="text" placeholder="Buscar series, películas, etc..." class="input-busqueda" id="input-nueva-busqueda">
            </div>
        </div>
        <div class="nav-der">
            <a href="index.html" style="color: white; text-decoration: none; font-weight: bold;">Volver al inicio</a>
        </div>
    </nav>

    <div class="contenedor-busqueda-pagina">
        <h1 class="titulo-resultados">Resultados para: <span class="texto-resaltado" id="termino-busqueda"></span></h1>
        
        <div class="cuadricula-resultados" id="contenedor-resultados">
            </div>
    </div>

    <script>
        // 1. Nuestra Base de Datos del Catálogo Fliver
        const catalogoFliver = [
            // Las 5 principales (tienen enlace a tu reproductor)
            { titulo: 'Stranger Things', img: './Imagenes/stranger-things.png', link: 'reproductor.html?id=stranger-things' },
            { titulo: 'Dark', img: './Imagenes/dark.png', link: 'reproductor.html?id=dark' },
            { titulo: 'La Casa de Papel', img: './Imagenes/la-casa-de-papel.png', link: 'reproductor.html?id=la-casa-de-papel' },
            { titulo: 'Olympo', img: './Imagenes/olympo.png', link: 'reproductor.html?id=olympo' },
            { titulo: 'Lupin', img: './Imagenes/lupin.png', link: 'reproductor.html?id=lupin' },

            // Otras Series
            { titulo: 'El Juego del Calamar', img: './Imagenes/series/el-juego-del-calamar.png', link: '#' },
            { titulo: 'Arcane', img: './Imagenes/series/arcane.png', link: '#' },
            { titulo: 'Miercoles', img: './Imagenes/series/miercoles.png', link: '#' },
            { titulo: 'Shogun', img: './Imagenes/series/shogun.png', link: '#' },
            { titulo: 'The Mandalorian', img: './Imagenes/series/the-mandalorian.png', link: '#' },

            // Películas
            { titulo: 'La Sociedad de la Nieve', img: './Imagenes/peliculas/la-sociedad-de-la-nieve.png', link: '#' },
            { titulo: 'El Planeta de los Simios', img: './Imagenes/peliculas/el-planeta-de-los-simios.png', link: '#' },
            { titulo: 'Dune Parte Dos', img: './Imagenes/peliculas/dune-parte-dos.png', link: '#' },
            { titulo: 'Barbie', img: './Imagenes/peliculas/barbie.png', link: '#' },
            { titulo: 'Avengers Endgame', img: './Imagenes/peliculas/avengers-endgame.png', link: '#' },
            { titulo: 'Spider-Man a traves del Spider-Verso', img: './Imagenes/peliculas/spider-man-a-traves-del-spider-verso.png', link: '#' },

            // Anime
            { titulo: 'Shingeki no Kyojin', img: './Imagenes/anime/shingeki-no-kyojin.png', link: '#' },
            { titulo: 'Demon Slayer', img: './Imagenes/anime/demon-slayer.png', link: '#' },
            { titulo: 'Jujutsu Kaisen', img: './Imagenes/anime/jujutsu-kaisen.png', link: '#' },
            { titulo: 'Naruto', img: './Imagenes/anime/naruto.png', link: '#' },
            { titulo: 'Death Note', img: './Imagenes/anime/death-note.png', link: '#' },

            // Documentales
            { titulo: 'Nuestro Planeta', img: './Imagenes/documentales/nuestro-planeta.png', link: '#' },
            { titulo: 'The Last Dance', img: './Imagenes/documentales/the-last-dance.png', link: '#' },
            { titulo: 'Cosmos', img: './Imagenes/documentales/cosmos.png', link: '#' }
        ];

        // 2. Leer qué escribió el usuario en la URL
        const parametros = new URLSearchParams(window.location.search);
        const busquedaOriginal = parametros.get('q') || '';
        const busquedaLimpia = busquedaOriginal.toLowerCase().trim();

        // Poner el texto en el título y en el buscador de la página
        document.getElementById('termino-busqueda').textContent = `"${busquedaOriginal}"`;
        document.getElementById('input-nueva-busqueda').value = busquedaOriginal;

        // 3. Filtrar el catálogo
        const contenedor = document.getElementById('contenedor-resultados');
        
        // Buscamos coincidencias en el título
        const resultados = catalogoFliver.filter(item => 
            item.titulo.toLowerCase().includes(busquedaLimpia)
        );

        // 4. Mostrar los resultados en pantalla
        if (busquedaLimpia === "") {
            contenedor.innerHTML = '<p class="sin-resultados">Por favor, escribe algo en el buscador.</p>';
        } else if (resultados.length > 0) {
            resultados.forEach(item => {
                const tarjeta = document.createElement('a');
                tarjeta.href = item.link;
                tarjeta.className = 'tarjeta-resultado';
                tarjeta.style.backgroundImage = `url('${item.img}')`;
                
                // Le ponemos el título encima de la imagen
                tarjeta.innerHTML = `<h3>${item.titulo}</h3>`;
                
                contenedor.appendChild(tarjeta);
            });
        } else {
            contenedor.innerHTML = '<p class="sin-resultados">No encontramos series ni películas que coincidan con tu búsqueda.</p>';
        }

        // ================= LÓGICA PARA BUSCAR OTRA VEZ DESDE ESTA PÁGINA =================
        const inputNuevaBusqueda = document.getElementById('input-nueva-busqueda');
        const btnNuevaBusqueda = document.querySelector('.btn-busqueda');

        function ejecutarNuevaBusqueda() {
            const consulta = inputNuevaBusqueda.value.trim();
            if (consulta !== "") {
                window.location.href = `buscar.html?q=${encodeURIComponent(consulta)}`;
            }
        }

        if (btnNuevaBusqueda && inputNuevaBusqueda) {
            btnNuevaBusqueda.addEventListener('click', (e) => {
                e.preventDefault();
                ejecutarNuevaBusqueda();
            });
            inputNuevaBusqueda.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    ejecutarNuevaBusqueda();
                }
            });
        }
    </script>
</body>
</html>
