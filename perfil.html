<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fliver - Mi Perfil</title>
    <link rel="icon" type="image/png" href="Imagenes/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="cuerpo-pagina-perfil">

    <nav>
        <div class="nav-izq">
            <a href="index.html" style="display:flex; align-items:center; text-decoration:none; color:white;">
                <img src="Imagenes/logo.png" class="logo" width="50" height="50">
                <span style="font-size: 24px; font-weight: bold; margin-left: 10px;">Fliver</span>
            </a>
        </div>
        <div class="nav-der">
            <a href="index.html" class="enlace-volver">Volver al inicio</a>
        </div>
    </nav>

    <div class="contenedor-principal-perfil">
        <h1>Editar Perfil</h1>
        
        <div class="contenido-perfil">
            <div class="seccion-editar-avatar">
                <div class="contenedor-avatar-actual">
                    <img src="Imagenes/avatares/avatardefault.png" id="avatar-actual-usuario" alt="Avatar Actual">
                    <span>Avatar actual</span>
                </div>
                
                <div class="cuadricula-seleccion-avatar">
                    <h3>Elige un nuevo avatar</h3>
                    <div class="cuadricula-avatares">
                        <img src="Imagenes/avatares/avatardefault.png" class="opcion-avatar" onclick="cambiarAvatar('Imagenes/avatares/avatardefault.png')">
                        <img src="Imagenes/avatares/avatar1.png" class="opcion-avatar" onclick="cambiarAvatar('Imagenes/avatares/avatar1.png')" title="Avatar1">
                        <img src="Imagenes/avatares/avatar2.png" class="opcion-avatar" onclick="cambiarAvatar('Imagenes/avatares/avatar2.png')" title="Avatar2">
                        <img src="Imagenes/avatares/avatar3.png" class="opcion-avatar" onclick="cambiarAvatar('Imagenes/avatares/avatar3.png')" title="Avatar3">
                        <img src="Imagenes/avatares/avatar4.png" class="opcion-avatar" onclick="cambiarAvatar('Imagenes/avatares/avatar4.png')" title="Avatar4">
                        <img src="Imagenes/avatares/avatar5.png" class="opcion-avatar" onclick="cambiarAvatar('Imagenes/avatares/avatar5.png')" title="Avatar5">
                        <img src="Imagenes/avatares/avatar6.png" class="opcion-avatar" onclick="cambiarAvatar('Imagenes/avatares/avatar6.png')" title="Avatar6">
                    </div>
                </div>
            </div>

            <div class="seccion-editar-info">
                <div id="alerta-perfil" class="alerta oculto"></div>

                <div class="caja-info">
                    <label>Nombre de usuario</label>
                    <input type="text" id="edit-username" class="input-perfil" placeholder="Cargando...">
                </div>
                <div class="caja-info">
                    <label>Correo electrónico</label>
                    <input type="email" id="edit-email" class="input-perfil" placeholder="Cargando...">
                </div>
                <div class="caja-info">
                    <label>Plan actual</label>
                    <p class="etiqueta-plan">Fliver Premium 4K</p>
                </div>
                
                <button class="btn-auth" id="btn-guardar-perfil" style="margin-top: 30px;">Guardar Cambios</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, updateProfile, updateEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBi_VG0KXAGCZEUeCuNwGZnQ4jpAp08SdU",
            authDomain: "fliver-43e68.firebaseapp.com",
            projectId: "fliver-43e68",
            storageBucket: "fliver-43e68.firebasestorage.app",
            messagingSenderId: "512225812744",
            appId: "1:512225812744:web:fc8e51e84de4f3a8938cbd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function mostrarAlertaPerfil(mensaje, tipo) {
            const cajaAlerta = document.getElementById('alerta-perfil');
            cajaAlerta.textContent = mensaje;
            cajaAlerta.className = 'alerta ' + tipo;
            cajaAlerta.classList.remove('oculto');
            setTimeout(() => { cajaAlerta.classList.add('oculto'); }, 4000);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('edit-username').value = user.displayName || "";
                document.getElementById('edit-email').value = user.email || "";
                
                const avatarGuardado = localStorage.getItem('fliver_user_avatar');
                if(avatarGuardado) {
                    document.getElementById('avatar-actual-usuario').src = avatarGuardado;
                }
            } else {
                window.location.href = 'login.html';
            }
        });

        document.getElementById('btn-guardar-perfil').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (!user) return;

            const newUsername = document.getElementById('edit-username').value;
            const newEmail = document.getElementById('edit-email').value;
            const btn = document.getElementById('btn-guardar-perfil');
            
            btn.textContent = "Guardando..."; 
            btn.disabled = true;

            try {
                let actualizado = false;

                if (newUsername !== user.displayName) {
                    await updateProfile(user, { displayName: newUsername });
                    actualizado = true;
                }

                if (newEmail !== user.email) {
                    await updateEmail(user, newEmail);
                    actualizado = true;
                }

                if (actualizado) {
                    mostrarAlertaPerfil('¡Datos actualizados correctamente!', 'exito');
                    setTimeout(() => { window.location.href = 'index.html'; }, 1500);
                } else {
                    window.location.href = 'index.html';
                }

            } catch (error) {
                console.error("Error al actualizar:", error);
                if (error.code === 'auth/requires-recent-login') {
                    mostrarAlertaPerfil('Por seguridad, debes cerrar sesión y volver a entrar para cambiar tu correo.', 'error');
                } else if (error.code === 'auth/email-already-in-use') {
                    mostrarAlertaPerfil('Este correo ya está registrado en otra cuenta.', 'error');
                } else {
                    mostrarAlertaPerfil('Hubo un error al actualizar los datos.', 'error');
                }
            } finally {
                btn.textContent = "Guardar Cambios";
                btn.disabled = false;
            }
        });
    </script>

    <script>
        function cambiarAvatar(ruta) {
            document.getElementById('avatar-actual-usuario').src = ruta;
            localStorage.setItem('fliver_user_avatar', ruta);
        }
    </script>
</body>
</html>
