<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fliver - Reproductor</title>
    <link rel="icon" type="image/png" href="Imagenes/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="cuerpo-reproductor">

    <nav class="nav-transparente">
        <div class="nav-izq">
            <a href="index.html" class="enlace-volver-icono">
                <span class="material-symbols-outlined">arrow_back</span>
                <span style="font-size: 20px; font-weight: bold; margin-left: 10px;">Volver al inicio</span>
            </a>
        </div>
        </nav>

    <div class="fondo-hero-serie" id="fondo-serie">
        <div class="degradado-hero"></div>
        
        <div class="info-serie-detalle">
            <img src="" id="logo-serie" alt="Título" class="logo-gigante-serie">
            
            <div class="metadatos-serie">
                <span class="coincidencia" id="coincidencia"></span>
                <span class="anio" id="anio"></span>
                <span class="etiqueta-edad" id="edad"></span>
                <span class="temporadas" id="temporadas"></span>
                <span class="calidad-hd">4K HDR</span>
            </div>

            <p class="sinopsis-detalle" id="sinopsis"></p>

            <div class="reparto-info">
                <p><strong>Protagonizada por:</strong> <span id="reparto"></span></p>
                <p><strong>Géneros:</strong> <span id="generos"></span></p>
            </div>

            <div class="botones-accion-serie">
                <button class="btn-reproducir-gigante" onclick="abrirReproductor()">
                    <span class="material-symbols-outlined">play_arrow</span> Reproducir Trailer
                </button>
                <button class="btn-secundario-circulo" title="Añadir a mi lista">
                    <span class="material-symbols-outlined">add</span>
                </button>
                <button class="btn-secundario-circulo" title="Me gusta">
                    <span class="material-symbols-outlined">thumb_up</span>
                </button>
            </div>
        </div>
    </div>

    <div id="modal-video" class="modal-video oculto">
        <button class="btn-cerrar-video" onclick="cerrarReproductor()">
            <span class="material-symbols-outlined">close</span>
        </button>
        <div class="contenedor-iframe">
            <iframe id="video-iframe" src="" title="Reproductor de video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        const baseDatosSeries = {
            'stranger-things': {
                fondo: './Imagenes/stranger-things.png',
                logo: './Imagenes/stranger-things-letter.png',
                coincidencia: '98% para ti', anio: '2022', edad: '+16', temporadas: '4 Temporadas',
                sinopsis: 'A raíz de la desaparición de un niño, un pueblo desvela un misterio relacionado con experimentos secretos, fuerzas sobrenaturales aterradoras y una niña muy extraña. El mundo del Revés está más cerca de lo que creen.',
                reparto: 'Winona Ryder, David Harbour, Millie Bobby Brown...',
                generos: 'Ciencia ficción, Terror, Drama, Años 80',
                trailer: './Trailers/stranger_things_trailer.mp4'
            },
            'dark': {
                fondo: './Imagenes/dark.png',
                logo: './Imagenes/dark-letter.png',
                coincidencia: '95% para ti', anio: '2020', edad: '+16', temporadas: '3 Temporadas',
                sinopsis: 'Tras la desaparición de un niño, cuatro familias desesperadas tratan de entender lo ocurrido a medida que van desvelando un retorcido misterio que abarca tres décadas.',
                reparto: 'Louis Hofmann, Oliver Masucci, Jördis Triebel...',
                generos: 'Thriller, Ciencia ficción, Misterio',
                trailer: './Trailers/dark_trailer.mp4'
            },
            'la-casa-de-papel': {
                fondo: './Imagenes/la-casa-de-papel.png',
                logo: './Imagenes/la-casa-de-papel-letter.png',
                coincidencia: '99% para ti', anio: '2021', edad: '+16', temporadas: '5 Temporadas',
                sinopsis: 'Ocho atracadores toman rehenes en la Fábrica Nacional de Moneda y Timbre española. Desde el encierro, su líder manipula a la policía para llevar a cabo un ambicioso plan.',
                reparto: 'Úrsula Corberó, Álvaro Morte, Itziar Ituño...',
                generos: 'Thriller, Acción, Suspense',
                trailer: './Trailers/la_casa_de_papel_trailer.mp4'
            },
            'olympo': {
                fondo: './Imagenes/olympo.png',
                logo: './Imagenes/olympo-letter.png',
                coincidencia: '92% para ti', anio: '2024', edad: '+12', temporadas: '1 Temporada',
                sinopsis: 'Cuando una nadadora sufre un colapso en un centro deportivo de alto rendimiento, Amaia descubre que la ambición de sus compañeros les está llevando a tomar riesgos extremos.',
                reparto: 'Clara Galle, Nira Carmona, Agustín Della...',
                generos: 'Drama, Deporte, Jóvenes',
                trailer: './Trailers/olympo_trailer.mp4'
            },
            'lupin': {
                fondo: './Imagenes/lupin.png',
                logo: './Imagenes/lupin-letter.png',
                coincidencia: '97% para ti', anio: '2023', edad: '+12', temporadas: '3 Temporadas',
                sinopsis: 'Inspirado por las aventuras de Arsène Lupin, el ladrón de guante blanco Assane Diop se propone vengar la injusticia sufrida por su padre a manos de una familia rica.',
                reparto: 'Omar Sy, Ludivine Sagnier, Clotilde Hesme...',
                generos: 'Acción, Misterio, Basado en libros',
                trailer: './Trailers/lupin_trailer.mp4'
            }
        };

        const parametrosURL = new URLSearchParams(window.location.search);
        let idSerie = parametrosURL.get('id');

        if (!idSerie || !baseDatosSeries[idSerie]) {
            idSerie = 'stranger-things';
        }

        const datos = baseDatosSeries[idSerie];

        document.getElementById('fondo-serie').style.backgroundImage = `url('${datos.fondo}')`;
        document.getElementById('logo-serie').src = datos.logo;
        document.getElementById('coincidencia').textContent = datos.coincidencia;
        document.getElementById('anio').textContent = datos.anio;
        document.getElementById('edad').textContent = datos.edad;
        document.getElementById('temporadas').textContent = datos.temporadas;
        document.getElementById('sinopsis').textContent = datos.sinopsis;
        document.getElementById('reparto').textContent = datos.reparto;
        document.getElementById('generos').textContent = datos.generos;

        // Lógica del vídeo
        const modalVideo = document.getElementById('modal-video');
        const iframeVideo = document.getElementById('video-iframe');

        function abrirReproductor() {
            modalVideo.classList.remove('oculto');
            iframeVideo.src = datos.trailer; 
        }

        function cerrarReproductor() {
            modalVideo.classList.add('oculto');
            iframeVideo.src = ""; 
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBi_VG0KXAGCZEUeCuNwGZnQ4jpAp08SdU",
            authDomain: "fliver-43e68.firebaseapp.com",
            projectId: "fliver-43e68",
            storageBucket: "fliver-43e68.firebasestorage.app",
            messagingSenderId: "512225812744",
            appId: "1:512225812744:web:fc8e51e84de4f3a8938cbd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'login.html';
            }
        });
    </script>
</body>
</html>
