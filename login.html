<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Fliver - Iniciar Sesión</title>
    <link rel="icon" type="image/png" href="Imagenes/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="cuerpo-login">

    <div class="cabecera-login">
        <img src="Imagenes/logo.png" alt="Fliver Logo" width="50" height="50">
        <span>Fliver</span>
    </div>

    <div class="contenedor-auth">
        <div class="caja-auth">
            
            <div class="pestanas-auth">
                <button class="pestana-auth activo" id="tab-login" onclick="mostrarFormulario('login')">Iniciar Sesión</button>
                <button class="pestana-auth" id="tab-register" onclick="mostrarFormulario('register')">Registrarse</button>
            </div>

            <div id="mensaje-alerta" class="alerta oculto"></div>

            <form id="form-login" class="formulario-auth formulario-activo">
                <h2>Bienvenido de nuevo</h2>
                
                <div class="grupo-input">
                    <input type="email" id="login-email" required>
                    <label>Correo electrónico</label>
                </div>
                
                <div class="grupo-input">
                    <input type="password" id="login-password" required>
                    <label>Contraseña</label>
                </div>
                
                <button type="submit" class="btn-auth">Entrar</button>
                
                <p class="enlace-cambio-auth">¿Primera vez en Fliver? <a href="#" onclick="mostrarFormulario('register')">Regístrate ahora.</a></p>
            </form>

            <form id="form-register" class="formulario-auth">
                <h2>Crea tu cuenta</h2>
                
                <div class="fila-inputs">
                    <div class="grupo-input">
                        <input type="text" id="reg-name" required>
                        <label>Nombre</label>
                    </div>
                    <div class="grupo-input">
                        <input type="text" id="reg-lastname" required>
                        <label>Apellidos</label>
                    </div>
                </div>

                <div class="grupo-input">
                    <input type="text" id="reg-username" required>
                    <label>Nombre de usuario</label>
                </div>

                <div class="grupo-input">
                    <input type="email" id="reg-email" required>
                    <label>Correo electrónico</label>
                </div>
                
                <div class="grupo-input">
                    <input type="password" id="reg-password" required minlength="6">
                    <label>Contraseña nueva</label>
                </div>

                <div class="grupo-input">
                    <input type="password" id="reg-confirm" required minlength="6">
                    <label>Confirmar contraseña</label>
                </div>
                
                <button type="submit" class="btn-auth">Comenzar a ver</button>
                
                <p class="enlace-cambio-auth">¿Ya tienes una cuenta? <a href="#" onclick="mostrarFormulario('login')">Inicia sesión.</a></p>
            </form>

        </div>
    </div>

    <script>
        function mostrarFormulario(tipo) {
            document.getElementById('tab-login').classList.remove('activo');
            document.getElementById('tab-register').classList.remove('activo');
            document.getElementById('form-login').classList.remove('formulario-activo');
            document.getElementById('form-register').classList.remove('formulario-activo');
            
            document.getElementById('tab-' + tipo).classList.add('activo');
            document.getElementById('form-' + tipo).classList.add('formulario-activo');
            document.getElementById('mensaje-alerta').className = 'alerta oculto';
        }

        function mostrarAlerta(mensaje, tipo) {
            const cajaAlerta = document.getElementById('mensaje-alerta');
            if(cajaAlerta) {
                cajaAlerta.textContent = mensaje;
                cajaAlerta.className = 'alerta ' + tipo;
                setTimeout(() => { cajaAlerta.classList.add('oculto'); }, 4000);
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBi_VG0KXAGCZEUeCuNwGZnQ4jpAp08SdU",
            authDomain: "fliver-43e68.firebaseapp.com",
            projectId: "fliver-43e68",
            storageBucket: "fliver-43e68.firebasestorage.app",
            messagingSenderId: "512225812744",
            appId: "1:512225812744:web:fc8e51e84de4f3a8938cbd"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);

            // REGISTRO
            document.getElementById('form-register').addEventListener('submit', (e) => {
                e.preventDefault(); 
                const username = document.getElementById('reg-username').value;
                const email = document.getElementById('reg-email').value;
                const password = document.getElementById('reg-password').value;
                const confirm = document.getElementById('reg-confirm').value;

                if(password !== confirm) {
                    mostrarAlerta('Las contraseñas no coinciden.', 'error');
                    return;
                }

                createUserWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        updateProfile(userCredential.user, {
                            displayName: username
                        }).then(() => {
                            mostrarAlerta('¡Registro exitoso! Ahora puedes iniciar sesión.', 'exito');
                            document.getElementById('form-register').reset();
                            setTimeout(() => mostrarFormulario('login'), 2000);
                        });
                    })
                    .catch((error) => {
                        if(error.code === 'auth/email-already-in-use') {
                            mostrarAlerta('Este correo ya está registrado.', 'error');
                        } else if(error.code === 'auth/weak-password') {
                            mostrarAlerta('La contraseña debe tener al menos 6 caracteres.', 'error');
                        } else {
                            mostrarAlerta('Error al registrar: ' + error.message, 'error');
                        }
                    });
            });

            // INICIO DE SESIÓN
            document.getElementById('form-login').addEventListener('submit', (e) => {
                e.preventDefault(); 
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                signInWithEmailAndPassword(auth, email, password)
                    .then((userCredential) => {
                        mostrarAlerta('Iniciando sesión...', 'exito');
                        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                    })
                    .catch((error) => {
                        if(error.code === 'auth/invalid-credential') {
                            mostrarAlerta('Correo o contraseña incorrectos.', 'error');
                        } else {
                            mostrarAlerta('Error al iniciar sesión.', 'error');
                        }
                    });
            });

        } catch(err) {
            console.error("Hubo un problema al cargar Firebase: ", err);
        }
    </script>
</body>
</html>
